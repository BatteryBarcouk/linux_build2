name: Build YS-M1 RK3128 Kernel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gcc-arm-linux-gnueabihf \
          make bc libssl-dev bison flex \
          device-tree-compiler git python3 \
          gcc-10-arm-linux-gnueabihf \
          cpp-10-arm-linux-gnueabihf

    - name: Create GCC 10 symlinks
      run: |
        sudo ln -sf /usr/bin/arm-linux-gnueabihf-gcc-10 /usr/local/bin/arm-linux-gnueabihf-10-gcc
        sudo ln -sf /usr/bin/arm-linux-gnueabihf-cpp-10 /usr/local/bin/arm-linux-gnueabihf-10-cpp
        for tool in ld as ar nm objcopy objdump strip; do
          [ -f /usr/bin/arm-linux-gnueabihf-$tool ] && \
            sudo ln -sf /usr/bin/arm-linux-gnueabihf-$tool /usr/local/bin/arm-linux-gnueabihf-10-$tool || true
        done
        arm-linux-gnueabihf-10-gcc --version

    - name: Clone RK3128 kernel
      run: |
        git clone --depth=1 -b release-3.10 \
          https://github.com/rockchip-linux/kernel.git rk3128-kernel

    - name: Apply compatibility patches
      working-directory: rk3128-kernel
      run: |
        # 1. Disable gcc-wrapper (blocks build with modern GCC warnings)
        sed -i 's|CC\t\t= \$(srctree)/scripts/gcc-wrapper.py \$(CROSS_COMPILE)gcc|CC\t\t= $(CROSS_COMPILE)gcc|' Makefile

        # 2. Fix dtc yylloc duplicate symbol for newer binutils
        sed -i 's/YYLTYPE yylloc/extern YYLTYPE yylloc/' scripts/dtc/dtc-lexer.lex.c_shipped

        # 3. Fix ARM assembly section flags for new binutils (#alloc -> "ax")
        find arch/arm -name "*.S" | xargs sed -i \
          's/, #alloc, #execinstr/,"ax"/g
           s/#alloc,#execinstr/"ax"/g
           s/, #alloc/,"a"/g' 2>/dev/null || true

        # 4. Force armv7-a march flag (fixes cpsid/dmb assembler errors)
        sed -i 's/arch-\$(CONFIG_CPU_32v7)\t\t:=-D__LINUX_ARM_ARCH__=7 \$(call cc-option,-march=armv7-a,-march=armv5t -Wa\$(comma)-march=armv7-a)/arch-$(CONFIG_CPU_32v7)\t\t:=-D__LINUX_ARM_ARCH__=7 -march=armv7-a/' arch/arm/Makefile

        # 5. Disable __asmeq checks (GCC 10 enforces register allocation itself)
        sed -i 's|#define __asmeq(x, y).*$|#define __asmeq(x, y) "" /* disabled for GCC 10+ */|' \
          arch/arm/include/asm/compiler.h

        # 6. Fix Werror in optee driver
        find security/optee_linuxdriver -name "Makefile" -exec \
          sed -i 's/ccflags-y+=-Werror/ccflags-y+=-Wno-error/g' {} \;

        # 7. Add -Wno-attributes globally to suppress log2.h warning
        sed -i '/KBUILD_CFLAGS.*FRAME_WARN/a KBUILD_CFLAGS\t+= -Wno-attributes -Wno-error=attributes' Makefile

        echo "All patches applied"

    - name: Create YS-M1 panel DTSI
      working-directory: rk3128-kernel
      run: |
        cat > arch/arm/boot/dts/lcd-ys-m1-ili9881c-mipi.dtsi << 'DTSI'
        #include <dt-bindings/rkmipi/mipi_dsi.h>

        / {
          disp_mipi_init: mipi_dsi_init {
            compatible = "rockchip,mipi_dsi_init";
            rockchip,screen_init = <1>;
            rockchip,dsi_lane = <4>;
            rockchip,dsi_hs_clk = <500>;
            rockchip,mipi_dsi_num = <1>;
          };

          disp_mipi_power_ctr: mipi_power_ctr {
            compatible = "rockchip,mipi_power_ctr";
          };

