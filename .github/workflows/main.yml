            rockchip,on-cmds1   { compatible="rockchip,on-cmds"; rockchip,cmd_type=<LPDT>; rockchip,dsi_id=<0>; rockchip,cmd=<0x15 0xe0 0x00>; rockchip,cmd_delay=<0>; };
